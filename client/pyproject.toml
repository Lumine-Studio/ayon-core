[project]
name="ayon-core"
description="AYON core addon."
dynamic = ["version"]

[tool.poetry.dependencies]
markdown = "^3.4.1"
clique = "1.6.*"
jsonschema = "^2.6.0"
pyblish-base = "^1.8.11"
pygments = "^2.15.0"
speedcopy = "^2.2"
six = "^1.15"
qtawesome = "0.7.3"
structlog = "^25.5"  # last version supporting python 3.9
# Upstream pins ">=1.7.0,<2", but every release of ftrack-python-api
#   caps websocket-client at "<1", so the two cannot resolve together.
#   Core only uses ABNF, WebSocketTimeoutException, create_connection
#   and _http._get_addrinfo_list, all present in 0.59.0.
websocket-client = ">=0.40.0,<2"

[ayon.runtimeDependencies]
aiohttp-middlewares = "^2.0.0"
Click = "^8"
OpenTimelineIO = "0.16.0"
opencolorio = "^2.5.1,<2.6.0"
Pillow = "9.5.0"
fontTools = "*"

[ayon.runtimeDependencies.darwin]
pyobjc-core = "^11.1"
